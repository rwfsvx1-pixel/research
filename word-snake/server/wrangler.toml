name = "sunnytown-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# 게임이 열리는 주소 (쉼표로 여러 개). 예: GitHub Pages 주소
ALLOWED_ORIGIN = "https://rwfsvx1-pixel.github.io"
# 쓸 모델. 비용을 줄이려면 "claude-haiku-5-5" 같은 가벼운 모델로 바꿀 수 있다.
MODEL = "claude-opus-5-5"

# 비밀 값은 여기 쓰지 말고 아래 명령으로 넣는다:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TOWN_KEY
